services:
  backend:
    image: mern-backend
    container_name: mern-backend
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 5000
    network_mode: bridge
    ports:
      - "5000:5000"

  frontend:
    image: mern-frontend
    container_name: mern-frontend
    links:
      - backend
    network_mode: bridge
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"
