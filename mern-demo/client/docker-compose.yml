version: '3.8'

services:
  backend:
    build: ./server
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb+srv://<username>:<password>@cluster.../dbname?retryWrites=true&w=majority
    networks:
      - mern-network

  frontend:
    build: ./client
    container_name: mern-frontend
    ports:
      - "3000:80"
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge